name: Palomar mechanical preflight
on:
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Full repository commit to verify; empty selects this workflow commit
        required: false
        type: string
permissions:
  contents: read
jobs:
  full:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
    with:
      repository: ${{ github.repository }}
      commit: ${{ github.event.pull_request.head.sha || inputs.commit || github.sha }}
      pipeline_commit: d4e41c1d5b0d114c4859e6e5831dc6d3ad1d0d44
      request_id: preflight001
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator-palomar.json","formalization_metadata_path":"formalization.yaml","authorization_relationship":"I am a responsible author or maintainer"}'
