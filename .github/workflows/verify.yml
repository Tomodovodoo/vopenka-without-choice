name: Lean and Comparator
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: python3 scripts/generate-palomar-challenge.py --check
      - name: Check every comparison configuration
        run: |
          for config in comparator*.json; do
            python3 scripts/check-repository.py --config "$config" --report ".cache/verification/${config%.json}-preflight.json"
          done
      - name: Validate metadata against the pinned upstream schema
        run: |
          python3 -m pip install jsonschema==4.26.0
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path
          import jsonschema
          revision = '99c678e569c7c4c0772db297c5ddd5e4c9b6322e'
          url = f'https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/{revision}/schema/v0.4.schema.json'
          with urllib.request.urlopen(url, timeout=30) as response:
              schema = json.load(response)
          jsonschema.validate(json.loads(Path('formalization.yaml').read_text()), schema)
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: submission-preflight
          path: .cache/verification/*preflight.json
  comparator:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Reserve disk for Lean exports on the disposable hosted runner
        run: |
          df -h .
          if [[ "${RUNNER_ENVIRONMENT:-}" == github-hosted ]]; then
            sudo rm -rf -- /usr/share/dotnet /usr/local/lib/android /opt/ghc
          fi
          df -h .
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          use-mathlib-cache: false
          use-github-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.24.0'
          cache: false
      - name: Reuse project builds at the same dependency revisions
        id: proof-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            .lake/foundation-build
          key: proofs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'vendor/Foundation/lakefile.toml') }}-${{ github.sha }}
          restore-keys: |
            proofs-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'vendor/Foundation/lakefile.toml') }}-
      - name: Compare Theorem A and run NanoDa
        run: bash scripts/verify-protected.sh comparator-palomar-a.json
      - name: Compare Theorem B and run NanoDa
        run: bash scripts/verify-protected.sh comparator-palomar-b.json
      - name: Compare the DC consequence and run NanoDa
        run: bash scripts/verify-protected.sh comparator-palomar-dc.json
      - name: Compare the Solovay consequence and run NanoDa
        run: bash scripts/verify-protected.sh comparator-palomar-solovay.json
      - name: Compare all four results in the original encoding
        run: bash scripts/verify-protected.sh comparator.json
      - name: Build all root imports and check coverage compositions
        run: |
          lake build ZFVP PalomarBridge PalomarPreservationBridge PalomarDCBridge PalomarSolovayBridge
          lake env lean verification/ExportChecks.lean
          lake env lean verification/AdditionalChecks.lean
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: comparator-evidence
          path: .cache/verification/
      - name: Record disk usage
        if: always()
        run: |
          df -h .
          du -sh .lake/build .lake/foundation-build .lake/packages .cache 2>/dev/null || true
      - name: Preserve completed builds even if a later verification step fails
        if: always() && steps.proof-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .lake/build
            .lake/foundation-build
          key: ${{ steps.proof-cache.outputs.cache-primary-key }}
